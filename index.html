async function verifyCode(code,saltHex,hashHex){try{const norm=String(code).toLowerCase().replace(/[^a-z0-9]/g,'');const salt=Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16)));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},key,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('')===hashHex}catch(e){return false}}

function layout(area){
  const all=vis().filter(s=>s.area===area);
  const list=all.filter(s=>s.lat!=null).sort((a,b)=>b.lat-a.lat);
  list.forEach((s,i)=>s.n=i+1);
  const unp=all.filter(s=>s.lat==null);unp.forEach(s=>{s.n=null});
  if(!list.length)return {list,unp,W:380,H:500,sc:0.8};
  const W=380,H=500,pad=48,R=92140,RL=111320;
  const lat0=list.reduce((a,s)=>a+s.lat,0)/list.length,lng0=list.reduce((a,s)=>a+s.lng,0)/list.length;
  list.forEach(s=>{s.mx=(s.lng-lng0)*R;s.my=-(s.lat-lat0)*RL});
  const xs=list.map(s=>s.mx),ys=list.map(s=>s.my);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const sc=Math.min((W-2*pad)/Math.max(maxx-minx,1),(H-2*pad)/Math.max(maxy-miny,1),0.8);
  list.forEach(s=>{s.x=W/2+(s.mx-(minx+maxx)/2)*sc;s.y=H/2+(s.my-(miny+maxy)/2)*sc;s.dx=s.x;s.dy=s.y});
  for(let k=0;k<150;k++){for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j];let vx=b.dx-a.dx,vy=b.dy-a.dy,d=Math.hypot(vx,vy);const m=27;if(d<m){if(d<0.01){vx=1;vy=0.3;d=1.04}const p=(m-d)/2,ux=vx/d,uy=vy/d;a.dx-=ux*p;a.dy-=uy*p;b.dx+=ux*p;b.dy+=uy*p}}}
  return {list,unp,W,H,sc};
}

function mapSVG(L){
  const {list,W,H,sc}=L;
  if(!list.length)return `<svg viewBox="0 0 380 180" role="img" aria-label="No pinned spots"><rect width="380" height="180" fill="#FAF7F0"/><text x="190" y="84" text-anchor="middle" font-size="14" fill="#7A6F65">No pinned spots here yet.</text><text x="190" y="108" text-anchor="middle" font-size="12" fill="#7A6F65">Open a spot below and drop its pin.</text></svg>`;
  const A=list[0],Z=list[list.length-1];
  let dx=Z.x-A.x,dy=Z.y-A.y;let len=Math.hypot(dx,dy);if(len<5){dx=0.5;dy=0.866;len=1}dx/=len;dy/=len;
  let nx=-dy,ny=dx;if(nx>0){nx=-nx;ny=-ny}
  let far=0;list.forEach(s=>{const d=(s.x-A.x)*nx+(s.y-A.y)*ny;if(d>far)far=d});
  const off=Math.max(22,far+18),ext=400;
  const E1=[A.x-dx*ext+nx*off,A.y-dy*ext+ny*off],E2=[Z.x+dx*ext+nx*off,Z.y+dy*ext+ny*off];
  const bar=sc>0.4?100:500,barPx=bar*sc;
  const coastal=COASTAL.includes(state.area);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of ${esc(state.area)} coffee spots"><rect width="${W}" height="${H}" fill="#FAF7F0"/>`;
  if(coastal){
    s+=`<polygon points="${E1[0]},${E1[1]} ${E2[0]},${E2[1]} -30,${H+120} -30,-120" fill="#DCEBF7"/>`;
    s+=`<line x1="${E1[0]}" y1="${E1[1]}" x2="${E2[0]}" y2="${E2[1]}" stroke="#F1E3C6" stroke-width="8"/>`;
    s+=`<text x="26" y="${H/2}" font-size="12" fill="#378ADD" letter-spacing="3" text-anchor="middle" transform="rotate(-90 26 ${H/2})">FALSE BAY</text>`;
  }
  s+=`<g transform="translate(348,34)"><line x1="0" y1="14" x2="0" y2="-6" stroke="#1A1410" stroke-width="1.5"/><polygon points="0,-12 -5,-3 5,-3" fill="#1A1410"/><text x="-4" y="30" font-size="11" fill="#7A6F65">N</text></g>`;
  s+=`<g transform="translate(${W-barPx-20},${H-18})"><line x1="0" y1="0" x2="${barPx}" y2="0" stroke="#1A1410" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" stroke="#1A1410" stroke-width="2"/><line x1="${barPx}" y1="-4" x2="${barPx}" y2="4" stroke="#1A1410" stroke-width="2"/><text x="0" y="-8" font-size="11" fill="#7A6F65">${bar} m</text></g>`;
  list.forEach(p=>{if(Math.hypot(p.dx-p.x,p.dy-p.y)>4)s+=`<line x1="${p.x}" y1="${p.y}" x2="${p.dx}" y2="${p.dy}" stroke="#7A6F65" stroke-width="1"/>`;s+=`<circle cx="${p.x}" cy="${p.y}" r="2.5" fill="#1A1410"/>`});
  list.forEach(p=>{const on=state.sel===p.id,st=status(p.id),live=(st==='open'||isLive(p.id));
    s+=`<g data-pin="${p.id}" style="cursor:pointer">${(p.user||p.src==='web')?`<circle cx="${p.dx}" cy="${p.dy}" r="${on?20:17}" fill="none" stroke="#1A1410" stroke-width="1.5" stroke-dasharray="3 3"/>`:''}${live?`<circle cx="${p.dx}" cy="${p.dy}" r="12" fill="#2ECC71" opacity="0.5" style="pointer-events:none"><animate attributeName="r" values="12;26;12" dur="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0;0.55" dur="1.3s" repeatCount="indefinite"/></circle>`:''}<circle cx="${p.dx}" cy="${p.dy}" r="${on?15:12}" fill="${live?'#17A05B':colour(p.type)}" stroke="${on?'#1A1410':'#fff'}" stroke-width="${on?3:2}">${live?'<animate attributeName="fill" values="#128A4C;#3FD982;#128A4C" dur="0.9s" repeatCount="indefinite"/>':''}</circle><text x="${p.dx}" y="${p.dy+4}" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" style="pointer-events:none">${p.n}</text>${(st==='closed'&&!live)?`<circle cx="${p.dx+11}" cy="${p.dy-11}" r="6" fill="#A32D2D" stroke="#fff" stroke-width="1.8" style="pointer-events:none"/>`:''}</g>`});
  if(state.sel){const p=list.find(q=>q.id===state.sel);if(p){const w=Math.min(p.name.length*6.4+16,230),lx=Math.min(Math.max(p.dx-w/2,6),W-w-6),ly=p.dy-34;
    s+=`<g style="pointer-events:none"><rect x="${lx}" y="${ly}" width="${w}" height="22" rx="6" fill="#1A1410"/><text x="${lx+w/2}" y="${ly+15}" text-anchor="middle" font-size="12" fill="#fff">${esc(p.name.length>34?p.name.slice(0,33)+'...':p.name)}</text></g>`}}
  return s+'</svg>';
}

async function loadShared(){

    const q1=sbBase()+'/rest/v1/photos?select=id,spot_id,path,tags,author,created_at&hidden=eq.false&order=created_at.asc&limit=1000';
    let r=await fetch(q1,{headers:sbH()});
    if(!r.ok)r=await fetch(q1.replace('tags,author,','tags,'),{headers:sbH()});
    if(r.ok){const rows=await r.json(),m={};rows.forEach(x=>{if(reported.indexOf(x.id)>-1)return;(m[x.spot_id]=m[x.spot_id]||[]).push({id:x.id,src:sbBase()+'/storage/v1/object/public/spot-photos/'+x.path,tags:x.tags||[],author:x.author||'',at:x.created_at})});shared=m}
    try{const rc=await fetch(sbBase()+'/rest/v1/checkins?select=id,spot_id,name,has_photo,created_at&created_at=gte.'+encodeURIComponent(new Date(Date.now()-TICKER_MS).toISOString())+'&order=created_at.desc&limit=100',{headers:sbH()});if(rc.ok){const rows=await rc.json();liveShared=rows.map(x=>({id:x.id,spot_id:x.spot_id,name:x.name,has_photo:!!x.has_photo,at:Date.parse(x.created_at)}))}}catch(e){}

async function uploadShared(id,dataUrl,tags,author){
  try{
    const f=dataUrlToFile(dataUrl,'p.jpg');
    const safe=String(id).replace(/[^A-Za-z0-9_-]/g,'-').slice(0,60);
    const path=safe+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    const up=await fetch(sbBase()+'/storage/v1/object/spot-photos/'+path,{method:'POST',headers:sbH({'Content-Type':'image/jpeg','x-upsert':'false'}),body:f});
    if(!up.ok)return null;
    const body={spot_id:id,path,tags:tags||[]};if(author)body.author=author;
    const send=()=>fetch(sbBase()+'/rest/v1/photos',{method:'POST',headers:sbH({'Content-Type':'application/json',Prefer:'return=representation'}),body:JSON.stringify(body)});
    let ins=await send();
    if(!ins.ok&&author){delete body.author;ins=await send()}
    if(!ins.ok)return null;
    const row=(await ins.json())[0];
    return {id:row.id,src:sbBase()+'/storage/v1/object/public/spot-photos/'+path,tags:row.tags||tags||[],author:row.author||author||'',at:row.created_at};
  }catch(e){return null}
}

let syncing=false;
async function syncLocal(){
  if(!sbOn()||syncing)return;syncing=true;let n=0,h=0;
  try{
    for(const id of Object.keys(vph)){
      if(String(id).indexOf('u-')===0)continue;
      const keep=[];
      for(const q of (vph[id]||[])){const row=await uploadShared(id,q.src,q.tags);if(row){(shared[id]=shared[id]||[]).push(row);mine.push(row.id);n++}else keep.push(q)}
      vph[id]=keep;
    }
    saveVph();saveMine();
    for(const id of Object.keys(hnd)){const ig=hnd[id]&&hnd[id].ig;if(ig&&!hnd[id].sent&&String(id).indexOf('u-')!==0){if(await shareHandle(id,ig)){hnd[id].sent=true;h++}}}
    saveHnd();
  }catch(e){}
  syncing=false;
  if(n||h){render();toast((n?n+' saved photo'+(n>1?'s':'')+' shared with everyone':'')+(n&&h?' and ':'')+(h?h+' handle'+(h>1?'s':'')+' shared':''))}
}
function dataUrlToFile(u,name){const parts=String(u).split(',');const mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(parts[1]||'');const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new File([arr],name,{type:mime})}
function sendContrib(onlyId){
  const ids=onlyId?[onlyId]:[...new Set(Object.keys(vph).filter(id=>vph[id]&&vph[id].length).concat(Object.keys(hnd)).concat(SPOTS.filter(x=>x.user).map(x=>x.id)))];
  const lines=['LekkeBru contributions from a visitor:'],files=[];
  ids.forEach(id=>{const sp=spot(id);if(!sp)return;const hh=hnd[id]||{},arr=vph[id]||[];
    if(!arr.length&&!hh.ig&&!sp.user)return;
    let ln=(sp.user?'NEW SPOT: ':'')+sp.name+' ('+sp.area+')';
    if(sp.user&&sp.lat!=null)ln+=' at '+sp.lat.toFixed(5)+', '+sp.lng.toFixed(5);
    if(hh.ig||sp.ig)ln+=' | Instagram: @'+(hh.ig||sp.ig);
    lines.push('');lines.push(ln);
    if(sp.user&&sp.note)lines.push('  note: '+sp.note);
    if(sp.user&&sp.photo)files.push(dataUrlToFile(sp.photo,id+'-main.jpg'));
    arr.forEach((q,i)=>{if(q.tags&&q.tags.length)lines.push('  photo '+(i+1)+' tagged: '+q.tags.join(', '));files.push(dataUrlToFile(q.src,id+'-'+(i+1)+'.jpg'))});
  });
  if(lines.length===1){toast('Nothing to send yet');return}
  const text=lines.join('\n');
  if(navigator.canShare&&files.length&&navigator.canShare({files})){
    navigator.share({files,title:'LekkeBru photos',text}).catch(e=>{if(!e||e.name!=='AbortError')toast('Sharing did not work. Use Copy instead.')});return;
  }
  copyText(text,()=>toast(files.length?'Details copied. Photos are downloading.':'Details copied'));
  files.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()});
}

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><label class="file" style="margin-top:0">Take photo<input type="file" accept="image/*" capture="environment" data-upload="vphoto" data-spot="${sel.id}"/></label><label class="file alt" style="margin-top:0">Add from photos<input type="file" accept="image/*" multiple data-upload="vphoto" data-spot="${sel.id}"/></label></div>

function gallery(s){
  const items=galleryItems(s);
  if(!items.length)return `<div class="photo ph"><div style="transform:scale(1.8)">${logo()}</div><div style="margin-top:10px;text-align:center;padding:0 24px">No photo yet. Be the first to add one.</div></div>`;
  const idx=Math.min(state.mainIdx,items.length-1),cur=items[idx];
  let h=`<img class="photo" src="${cur.src}" alt="" style="object-position:${s.owner?'50% 30%':'center'}" onerror="this.style.visibility='hidden'"/>`;
  if(items.length>1)h+=`<div class="thumbs">${items.map((x,i)=>`<img class="th${i===idx?' on':''}" src="${x.src}" data-main="${i}" alt=""/>`).join('')}</div>`;
  if(s.credit)h+=`<div class="note" style="margin-top:8px">${esc(s.credit)}</div>`;
  if(cur.vis)h+=`<div class="note" style="margin-top:8px">${cur.shared?(mine.indexOf(cur.id)>-1?'Your photo':'Visitor photo'+(cur.author?' by '+esc(cur.author):'')):'Saved on this phone only'}${cur.tags.length?' &middot; with '+cur.tags.map(esc).join(', '):''} ${cur.shared?(mine.indexOf(cur.id)>-1?'':`<button class="clr" data-report="${cur.id}">Report</button>`):`<button class="clr" data-rmvph="${cur.i}">Remove</button>`}</div>`;
  return h;
}

}

function onlineCard(s){
  const hh=hnd[s.id]||{},ig=igOf(s),fb=String(hh.fb||s.fb||'').replace(/[^A-Za-z0-9._-]/g,''),web=s.web;
  let b='';
  if(ig)b+=`<a class="btn" href="https://instagram.com/${ig}" target="_blank" rel="noopener">Instagram @${esc(ig)}</a> `;
  if(fb)b+=`<a class="btn alt" href="https://facebook.com/${fb}" target="_blank" rel="noopener">Facebook</a> `;
  if(web)b+=`<a class="btn alt" href="https://${esc(web)}" target="_blank" rel="noopener">${esc(web)}</a> `;
  const add=ig?'':`<label>Know their Instagram? Add it so people can tag them</label><div class="grid2"><input class="in" data-hf="1" value="${esc(state.hf)}" placeholder="@handle"/><button class="btn alt" style="margin:0" data-savehandle="${s.id}">Save</button></div>`;
  return `<div class="sec"><h3>Find them online</h3>${b||'<div style="font-size:14px;color:var(--muted)">No social links yet.</div>'}${add}</div>`;
}
function addPhotoCard(s){
  return `<div class="sec"><h3>Add your photo</h3><div style="font-size:13px;color:var(--muted);line-height:1.4">Snap it now or pick one from your phone. Tag the friends who were with you.${sbOn()?' Photos you add are visible to everyone, so please only share photos you are happy for others to see.':''}</div>
  <label>Tag friends (names or @handles, separated by commas)</label><input class="in" data-tagin="1" value="${esc(state.tags)}" placeholder="e.g. Jannes, @jackie"/>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><label class="file">Take a photo<input type="file" accept="image/*" capture="environment" data-upload="vphoto"/></label><label class="file alt">Choose from photos<input type="file" accept="image/*" multiple data-upload="vphoto"/></label></div>
  <button class="btn alt" data-tagshare="${s.id}">Tag and tell friends</button>
  ${((vph[s.id]&&vph[s.id].length)||(hnd[s.id]&&hnd[s.id].ig))?`<button class="btn alt" data-sendcontrib="${s.id}">Send my photos and details to LekkeBru</button>`:''}</div>`;
}
function aboutTab(s,r,v){
  let h='';
  {const ev=lastEvent(s.id,TICKER_MS);if(ev)h+=`<div class="spec-strip" style="background:var(--green-l);color:var(--green-d);margin:12px 20px 0"><b>${esc(evText(ev))}</b> &middot; ${ago(ev.at)}</div>`}
  if(s.imported)h+=`<div class="sp"><div class="eb">Welcome</div><div class="tt">Someone added ${esc(s.name)} to LekkeBru</div><div class="ds">Is this your place? Claim it for free to post your hours, specials and menu.</div><button class="btn" data-claim="${s.id}">Claim this spot</button></div>`;
  if(s.src==='web')h+=`<div class="sec"><h3>Found online</h3><div style="font-size:14px;line-height:1.5">${s.info?esc(s.info)+'<br>':''}${s.addr?'<span style="color:var(--muted)">'+esc(s.addr)+'</span><br>':''}<span style="color:var(--muted);font-size:12px">Found online and not verified. Help out: pin it, add a photo and rate it.</span></div></div>`;
  if(s.note)h+=`<div class="sec"><h3>Note from the person who added it</h3><div style="font-size:14px;line-height:1.45">${esc(s.note)}</div></div>`;
  if(v&&v.about)h+=`<div class="sec"><h3>From the owner</h3><div style="font-size:15px;line-height:1.5">${esc(v.about)}</div></div>`;
  if(v&&v.special)h+=`<div class="sp"><div class="eb">Today's special</div><div class="tt">${esc(v.special.title)}</div>${v.special.desc?`<div class="ds">${esc(v.special.desc)}</div>`:''}<div class="un">${v.special.price?esc(v.special.price):''}${v.special.price&&v.special.until?' · ':''}${v.special.until?'Until '+esc(v.special.until):''}</div></div>`;
  if(s.lat!=null)h+=`<a class="dir" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">Get directions</a>`;
  else h+=`<div class="sec"><h3>Where is it?</h3><div style="font-size:14px;color:var(--muted);line-height:1.45">This spot has no pin yet. If you are there, drop the pin so others can find it.</div><button class="btn" data-pinit="${s.id}">Pin this spot</button> <a class="btn alt" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' '+(s.addr||s.area))}" target="_blank" rel="noopener">Find on Google Maps</a></div>`;
  h+=onlineCard(s);
  if(v)h+=menuView(v);
  if(s.owner){
    const bits=[v.roast&&['Roast',v.roast],v.beans&&['Beans',v.beans],v.flat&&['Flat white',v.flat]].filter(Boolean);
    h+=`<div class="sec"><h3>The coffee</h3>${bits.length?bits.map(([k,x])=>`<div class="mrow"><span style="color:var(--muted)">${k}</span><b>${esc(x)}</b></div>`).join(''):'<div style="font-size:14px;color:var(--muted)">Not added yet.</div>'}</div>`;
  }else{
    h+=`<div class="sec"><h3>The coffee</h3><div style="font-size:12px;color:var(--muted);margin-bottom:6px">No owner has claimed this spot yet. Add what you know.</div>
    <label style="margin-top:0">Roast used</label>
    <div class="roasts">${ROASTS.map(x=>`<button class="rb${r.roast===x?' on':''}" data-roast="${x}">${x}</button>`).join('')}</div>
    <label>Roaster or beans</label><input class="in" data-field="roaster" value="${esc(r.roaster)}" placeholder="Which roaster or origin?"/>
    <label>Typical price for a flat white</label><input class="in" data-field="price" value="${esc(r.price)}" placeholder="R__"/></div>`;
  }
  h+=addPhotoCard(s);
  h+=`<div class="sec"><h3>Opening hours</h3><div style="font-size:14px;color:var(--muted)">Not added yet.</div></div>`;
  if(!s.owner)h+=`<div class="sec"><h3>Is this your place?</h3><div style="font-size:14px;color:var(--muted);line-height:1.4">Owners claim their spot for free to add hours, specials, a menu and photos.</div><button class="btn" data-claim="${s.id}">Claim this spot</button> <button class="btn alt" data-notify="${s.id}">Tell them they are on LekkeBru</button></div>`;
  h+=`<div class="note">Want to know how others rate it? Open the Ratings tab.</div><div style="height:40px"></div>`;
  return h;
}
function ratingsTab(s,r){
  const o=overall(s.id),hasDemo=!!DEMO[s.id];
  let h=`<div class="sec"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h3 style="margin:0">LekkeScore</h3><div style="font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4">${hasDemo?'Demo scores for the test cart.':(o?'Your rating, saved on this phone. Community scores will join it when LekkeBru goes live.':'No ratings yet. Be the first to rate this spot. Yours is saved on this phone and joins the community scores when LekkeBru goes live.')}</div></div><div class="big" id="ov">${o||'-'}</div></div></div>
  <div class="sec"><h3>Rate this spot, out of 10</h3>`;
  CATS.forEach(([k,lbl])=>{const u=r.scores[k],has=typeof u==='number',val=eff(s.id,k),none=val==null;
    h+=`<div class="rate"><div class="rate-top"><span>${lbl}</span><span><span class="rate-val" id="v-${k}"${none?' style="color:var(--muted);font-weight:400;font-size:13px;font-family:DM Sans,sans-serif"':''}>${none?'Not rated':f1(val)}</span><span class="demo-tag" id="d-${k}"${(has||none)?' hidden':''}>demo</span></span></div><input type="range" min="0" max="10" step="0.5" value="${none?5:val}" data-cat="${k}"/><button class="clr" id="c-${k}" data-clear="${k}"${has?'':' hidden'}>${hasDemo?'Reset to demo':'Clear my rating'}</button></div>`});
  h+=`</div><div class="sec"><h3>Your notes</h3><textarea class="in" data-field="notes" placeholder="What stood out? Best seat, best time, what to order">${esc(r.notes)}</textarea></div>
  <div class="note">Saved on this phone only for now.</div><div class="foot"><button class="btn alt" data-export="1">Copy my ratings, photos and added spots</button><div id="exp"></div></div>`;
  return h;
}
function detail(){
  const s=spot(state.detail);
  if(s.owner&&!canOwner(s.id)){state.detail=null;return home()}
  const r=rec(s.id),v=s.owner?vend(s.id):null,owner=s.owner&&canOwner(s.id)&&state.view==='owner',ig=igOf(s);
  let h=`<div class="top"><button class="back" data-back="1">&larr; Back to map</button><div class="wm">${logo()}Lekke<em>Bru</em></div></div>`;
  if(s.owner&&canOwner(s.id))h+=`<div class="seg"><button class="${owner?'on':''}" data-view="owner">Owner view</button><button class="${owner?'':'on'}" data-view="customer">Customer view</button></div>`;
  h+=gallery(s);

function importFromHash(){

    if(!name||!area||!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return;
    let sp=vis().find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.lat!=null&&dist(x.lat,x.lng,lat,lng)<150);
    if(!sp){sp={id:'u-'+Date.now().toString(36),name,type,area,lat,lng,user:true,imported:true,addedAt:Date.now()};SPOTS.push(sp);saveSpots()}
    state.area=sp.area;state.detail=sp.id;state.view='customer';state.dtab='about';state.mainIdx=0;
  }catch(e){}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
}

    t.value='';render();return}
  if(t.type==='file'&&t.dataset.upload==='bphoto'){const f=t.files[0];if(f){try{state.bg.photo=await shrink(f,900,0.72);render()}catch(err){toast('Could not read that image')}}return}
  if(t.type==='file'&&t.dataset.upload==='addphoto'){const f=t.files[0];if(f){try{state.ad.photo=await shrink(f,900,0.72);render();if(t.dataset.gpsafter&&state.ad.lat==null)useGPS('ad')}catch(err){toast('Could not read that image')}}return}
  if(t.type!=='file'||!t.dataset.upload)return;
  const v=vend(state.detail),menu=t.dataset.upload==='menu',list=menu?v.menuPhotos:v.photos,limit=menu?4:8;
  let added=0;
  for(const f of [...t.files]){
    if(list.length>=limit){toast('Limit of '+limit+' photos reached');break}
    try{list.push(await shrink(f,menu?1100:900,0.72));added++}catch(err){toast('Could not read that image')}
  }
  if(added&&!save()){list.splice(list.length-added,added);toast('Phone storage is full. Remove a photo first.')}
  else if(added)toast(added+' photo'+(added>1?'s':'')+' added');
  t.value='';render();
});
importFromHash();
let ownerLinkCode=null;
{const m=location.hash.match(/^#owner=([A-Za-z0-9-]{8,24})$/);if(m){ownerLinkCode=m[1];try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}}
render();
if(ownerLinkCode){state.oc=ownerLinkCode;ownerLogin(true)}

if(sbOn()){loadShared().then(syncLocal);setInterval(()=>{if(!document.hidden)loadShared()},45000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadShared()})}
