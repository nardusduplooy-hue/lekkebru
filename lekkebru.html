<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LekkeBru</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F4EF;--card:#FFFFFF;--text:#1A1410;--muted:#7A6F65;--border:#E8E0D5;--green:#1D6B4B;--green-light:#EAF3DE;--green-dark:#27500A;--amber:#854F0B;--amber-light:#FAEEDA;--amber-border:#FAC775;--red:#A32D2D;--red-light:#FCEBEB}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:420px;margin:0 auto}
h1,h2,h3,.syne{font-family:'Syne',sans-serif}
.app{display:flex;flex-direction:column;min-height:100vh}
.main{padding-bottom:72px}
.topbar{background:var(--card);border-bottom:0.5px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.wordmark{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
.wordmark em{color:var(--green);font-style:normal}
.live-pill{display:flex;align-items:center;gap:6px;background:var(--green-light);border-radius:20px;padding:5px 12px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.live-label{font-size:12px;font-weight:500;color:var(--green-dark)}
.hero{padding:22px 20px 8px}
.hero-q{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-0.5px}
.hero-q em{color:var(--green);font-style:normal}
.hero-meta{font-size:13px;color:var(--muted);margin-top:6px}
.filters{display:flex;gap:7px;padding:12px 20px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{white-space:nowrap;border:0.5px solid var(--border);border-radius:20px;padding:6px 13px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--card);color:var(--muted);cursor:pointer;transition:all 0.15s;flex-shrink:0}
.fbtn.on{background:var(--text);color:#fff;border-color:var(--text)}
.vendor-list{padding:4px 20px 20px;display:flex;flex-direction:column;gap:10px}
.vendor-card{background:var(--card);border-radius:14px;border:0.5px solid var(--border);padding:14px 16px;cursor:pointer;transition:border-color 0.15s}
.vendor-card:hover{border-color:#aaa}
.vc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.vc-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:-0.2px;color:var(--text)}
.vc-area{font-size:12px;color:var(--muted);margin-top:2px}
.bruscore{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--green);line-height:1}
.bruscore-lbl{font-size:10px;color:var(--muted);text-align:right}
.vc-chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:11px;border-radius:6px;padding:3px 8px;font-weight:500}
.chip-mobile{background:var(--green-light);color:var(--green-dark)}
.chip-fixed{background:#E6F1FB;color:#0C447C}
.chip-price{background:var(--bg);color:var(--muted);border:0.5px solid var(--border)}
.special-row{display:flex;align-items:baseline;gap:6px;margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border)}
.special-lbl{font-size:11px;font-weight:500;color:var(--amber);flex-shrink:0}
.special-name{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divider{display:flex;align-items:center;gap:10px;padding:4px 20px 10px}
.divider-line{flex:1;height:0.5px;background:var(--border)}
.divider-lbl{font-size:11px;color:var(--muted);white-space:nowrap}
.closed-card{background:var(--card);border-radius:14px;border:0.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;opacity:0.45;margin:0 20px 8px}
.closed-name{font-size:13px;color:var(--muted)}
.closed-area{font-size:11px;color:var(--muted);margin-top:2px}
.detail{background:var(--bg);min-height:100vh;padding-bottom:72px}
.det-topbar{background:var(--card);border-bottom:0.5px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif}
.photo-zone{background:#D4E8DC;height:180px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.photo-lbl{font-size:12px;color:#3B6D11;font-weight:500;background:#C0DD97;border-radius:20px;padding:4px 14px}
.det-identity{background:var(--card);padding:18px 20px 16px;border-bottom:0.5px solid var(--border)}
.det-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-0.5px;color:var(--text)}
.det-score-big{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:var(--green);line-height:1}
.det-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.open-pill{display:flex;align-items:center;gap:5px;background:var(--green-light);border-radius:20px;padding:4px 10px}
.open-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.4s ease-in-out infinite}
.open-txt{font-size:12px;font-weight:500;color:var(--green-dark)}
.type-pill{background:var(--bg);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--muted);border:0.5px solid var(--border)}
.det-special{margin:12px 20px 0;background:var(--amber-light);border-radius:12px;border:0.5px solid var(--amber-border);padding:14px 16px}
.sp-eyebrow{font-size:10px;font-weight:500;color:var(--amber);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px}
.sp-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#633806;margin-bottom:3px}
.sp-desc{font-size:13px;color:var(--amber);line-height:1.4}
.sp-until{font-size:11px;color:#BA7517;margin-top:6px}
.det-section{background:var(--card);border-radius:12px;border:0.5px solid var(--border);margin:12px 20px 0;overflow:hidden}
.det-section-head{padding:12px 16px 0;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0.4px;text-transform:uppercase}
.scores-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.sc{padding:14px 16px;border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border)}
.sc:nth-child(2n){border-right:none}
.sc:nth-child(3),.sc:nth-child(4){border-bottom:none}
.sc-lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
.sc-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;line-height:1}
.sc-bar{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.sc-fill{height:100%;border-radius:2px;background:var(--green)}
.sc-fill.amber{background:var(--amber)}
.rel-row{padding:12px 16px;border-top:0.5px solid var(--border)}
.rel-lbl{font-size:11px;color:var(--muted);margin-bottom:6px}
.rel-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.rel-fill{height:100%;border-radius:3px;background:var(--green)}
.rel-meta{display:flex;justify-content:space-between;margin-top:4px}
.rel-score{font-size:12px;font-weight:500;color:var(--green)}
.rel-desc{font-size:11px;color:var(--muted)}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:0.5px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-lbl{font-size:13px;color:var(--muted)}
.info-val{font-size:13px;font-weight:500;text-align:right}
.hours-section{background:var(--card);border-radius:12px;border:0.5px solid var(--border);margin:12px 20px 0;overflow:hidden}
.hrs-head{padding:12px 16px 8px;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:0.4px;text-transform:uppercase}
.hrs-row{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:0.5px solid var(--border)}
.hrs-row:last-child{border-bottom:none}
.hrs-row.today{background:var(--bg)}
.hrs-day{font-size:13px;color:var(--muted);min-width:36px}
.hrs-day.today{font-weight:500;color:var(--text)}
.hrs-time{font-size:13px}
.today-badge{font-size:10px;background:var(--green-light);color:var(--green-dark);border-radius:4px;padding:2px 6px;font-weight:500}
.cta-area{padding:16px 20px 4px;display:flex;flex-direction:column;gap:10px}
.cta-primary{width:100%;background:var(--text);color:#fff;border:none;border-radius:12px;padding:15px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.cta-secondary{width:100%;background:var(--card);color:var(--text);border:0.5px solid var(--border);border-radius:12px;padding:13px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer}
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--card);border-top:0.5px solid var(--border);display:flex;padding:8px 0;z-index:200}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;background:none;border:none;font-family:'DM Sans',sans-serif}
.nav-icon{font-size:20px}
.nav-lbl{font-size:10px;color:var(--muted)}
.nav-item.active .nav-lbl{color:var(--green)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const VENDORS=[
  {id:1,name:"Die Bru Wa",type:"mobile",area:"Strand Strandboulevard",isOpen:true,price:"R35-R50",special:"Klapper Koud Brou",specialDesc:"Huisgemaakte koud brou met klappersroom en kaneel.",until:"11:00",scores:{coffee:9.2,price:8.8,view:9.5,vibe:9.0,reliability:8.5},address:"Marine Drive, Strand",bestTime:"06:30-09:00",opensAt:null,hours:{mon:"06:30-11:00",tue:"06:30-11:00",wed:"06:30-11:00",thu:"06:30-11:00",fri:"06:30-12:00",sat:"06:00-13:00",sun:"06:00-12:00"}},
  {id:2,name:"Promenade Pour",type:"mobile",area:"Gordonsbaai Prom",isOpen:true,price:"R30-R45",special:"Heuning Amandel Latte",specialDesc:"Enkele oorsprong espresso met amandel en fynbosheuning.",until:"10:00",scores:{coffee:8.8,price:9.2,view:8.5,vibe:9.5,reliability:7.8},address:"Hawestraat Promenade, Gordonsbaai",bestTime:"07:00-10:00",opensAt:null,hours:{mon:"07:00-10:30",tue:"07:00-10:30",wed:"Gesluit",thu:"07:00-10:30",fri:"07:00-11:00",sat:"06:30-12:00",sun:"06:30-12:00"}},
  {id:3,name:"Sout en Grond",type:"fixed",area:"Seepunt Promenade",isOpen:true,price:"R45-R75",special:"Etiopistiese Pour Over",specialDesc:"Liggebraaide Yirgacheffe - blommerig en helder.",until:"15:00",scores:{coffee:9.5,price:7.2,view:8.8,vibe:9.0,reliability:9.8},address:"Beachroad, Seepunt",bestTime:"07:00-14:00",opensAt:null,hours:{mon:"07:00-17:00",tue:"07:00-17:00",wed:"07:00-17:00",thu:"07:00-17:00",fri:"07:00-18:00",sat:"07:00-16:00",sun:"08:00-14:00"}},
  {id:4,name:"Mouille Point Mark",type:"fixed",area:"Mouille Point",isOpen:true,price:"R35-R60",special:"Kortado en Beskuit",specialDesc:"Dubbele kortado saam met plaas beskuit.",until:"10:30",scores:{coffee:8.9,price:8.0,view:9.2,vibe:9.3,reliability:8.0},address:"Beachroad by die vuurtoring",bestTime:"07:00-11:00",opensAt:null,hours:{mon:"Gesluit",tue:"Gesluit",wed:"Gesluit",thu:"Gesluit",fri:"Gesluit",sat:"07:00-12:00",sun:"07:00-11:00"}},
  {id:5,name:"Clifton Krat",type:"mobile",area:"Groenpunt Baan",isOpen:true,price:"R35-R55",special:"Matcha Espresso Skok",specialDesc:"Dubbel kop oor seremoniale matcha. Die perdepil.",until:"09:30",scores:{coffee:8.3,price:8.2,view:8.5,vibe:9.2,reliability:8.8},address:"Signal Hill Rd, Groenpunt",bestTime:"06:30-10:00",opensAt:null,hours:{mon:"06:30-10:30",tue:"06:30-10:30",wed:"06:30-10:30",thu:"06:30-10:30",fri:"06:30-11:00",sat:"06:00-12:00",sun:"06:00-12:00"}},
  {id:6,name:"Hawebrou Ko.",type:"fixed",area:"Gordonsbaai Hawe",isOpen:true,price:"R45-R80",special:"Visserman se Mocha",specialDesc:"Donkersjokolade mocha met n knippie seesout. Vra vir ys.",until:"14:00",scores:{coffee:9.0,price:7.0,view:9.9,vibe:9.0,reliability:9.2},address:"12 Hawestraat, Gordonsbaai",bestTime:"08:00-14:00",opensAt:null,hours:{mon:"08:00-17:00",tue:"08:00-17:00",wed:"08:00-17:00",thu:"08:00-17:00",fri:"08:00-18:00",sat:"07:30-17:00",sun:"07:30-16:00"}},
  {id:7,name:"Bru op Wiele",type:"mobile",area:"Strand en Somwest",isOpen:true,price:"R30-R50",special:"Vandag: Strand Lewensredder",specialDesc:"Geparkeer by die lewensredderstoring. Soek die geel sambreel.",until:"10:00",scores:{coffee:8.7,price:8.8,view:8.0,vibe:9.5,reliability:6.5},address:"Wissel daagliks",bestTime:"06:30-10:00",opensAt:null,hours:{mon:"06:30-10:00",tue:"06:30-10:00",wed:"06:30-10:00",thu:"06:30-10:00",fri:"06:30-11:00",sat:"06:00-12:00",sun:"06:00-11:00"}},
  {id:8,name:"Klipdrif Koffie",type:"mobile",area:"Strand Strand",isOpen:false,price:"R20-R35",special:null,specialDesc:null,until:null,scores:{coffee:7.8,price:9.8,view:8.2,vibe:8.8,reliability:7.0},address:"Hoek Loch en Strandweg, Strand",bestTime:"05:30-09:00",opensAt:"05:30 more",hours:{mon:"05:30-09:00",tue:"05:30-09:00",wed:"05:30-09:00",thu:"05:30-09:00",fri:"05:30-09:00",sat:"05:00-10:00",sun:"05:00-10:00"}},
  {id:9,name:"Die Brandhuis",type:"fixed",area:"Somerset-Wes",isOpen:false,price:"R40-R70",special:null,specialDesc:null,until:null,scores:{coffee:9.7,price:7.5,view:6.8,vibe:8.5,reliability:9.5},address:"19 Lourenstraat, Somerset-Wes",bestTime:"07:30-13:00",opensAt:"07:30 more",hours:{mon:"07:30-17:00",tue:"07:30-17:00",wed:"07:30-17:00",thu:"07:30-17:00",fri:"07:30-18:00",sat:"08:00-14:00",sun:"Gesluit"}},
  {id:10,name:"Blou Horison Kar",type:"mobile",area:"Gordonsbaai Hawe",isOpen:false,price:"R30-R50",special:null,specialDesc:null,until:null,scores:{coffee:8.5,price:8.5,view:9.8,vibe:8.8,reliability:7.5},address:"Hawepad, Gordonsbaai",bestTime:"06:00-09:30",opensAt:"06:00 more",hours:{mon:"06:00-09:30",tue:"06:00-09:30",wed:"06:00-09:30",thu:"06:00-09:30",fri:"06:00-10:00",sat:"05:30-11:00",sun:"05:30-11:00"}}
];
function avg(s){return((s.coffee+s.price+s.view+s.vibe+s.reliability)/5).toFixed(1)}
let state={tab:"home",filter:"Alles",selected:null};
function render(){
  const app=document.getElementById("app");
  if(state.selected){app.innerHTML=detailHTML(state.selected);return}
  if(state.tab==="home")app.innerHTML=homeHTML();
  if(state.tab==="map")app.innerHTML=mapHTML();
  if(state.tab==="dash")app.innerHTML=dashHTML();
}
function homeHTML(){
  const open=VENDORS.filter(v=>v.isOpen);
  const closed=VENDORS.filter(v=>!v.isOpen);
  const f=state.filter;
  let list=[...open];
  if(f==="Mobiel")list=list.filter(v=>v.type==="mobile");
  if(f==="Beste Uitsig")list.sort((a,b)=>b.scores.view-a.scores.view);
  if(f==="Beste Prys")list.sort((a,b)=>b.scores.price-a.scores.price);
  if(f==="Beste Koffie")list.sort((a,b)=>b.scores.coffee-a.scores.coffee);
  const filters=["Alles","Mobiel","Beste Koffie","Beste Uitsig","Beste Prys"];
  return`<div class="app"><div class="main">
  <div class="topbar"><div class="wordmark">Lekke<em>Bru</em></div><div class="live-pill"><div class="live-dot"></div><span class="live-label">${open.length} oop nou</span></div></div>
  <div class="hero"><div class="hero-q">Wie is oop<br><em>nou op die oomblik?</em></div><div class="hero-meta">Strand · Gordonsbaai · Seepunt · pas opgedateer</div></div>
  <div class="filters">${filters.map(fi=>`<button class="fbtn${fi===f?" on":""}" onclick="setFilter('${fi}')">${fi}</button>`).join("")}</div>
  <div class="vendor-list">${list.length===0?`<div style="text-align:center;padding:40px 0;color:var(--muted);font-size:14px">Geen karre oop nie. Probeer Alles.</div>`:list.map(v=>`
    <div class="vendor-card" onclick="openDetail(${v.id})">
      <div class="vc-top"><div><div class="vc-name">${v.name}</div><div class="vc-area">${v.area}</div></div><div><div class="bruscore">${avg(v.scores)}</div><div class="bruscore-lbl">LekkeSkor</div></div></div>
      <div class="vc-chips"><span class="chip ${v.type==="mobile"?"chip-mobile":"chip-fixed"}">${v.type==="mobile"?"Mobiele kar":"Koffiewinkel"}</span><span class="chip chip-price">${v.price}</span></div>
      ${v.special?`<div class="special-row"><span class="special-lbl">Vandag</span><span class="special-name">${v.special}</span></div>`:""}
    </div>`).join("")}</div>
  <div class="divider"><div class="divider-line"></div><div class="divider-lbl">tans gesluit</div><div class="divider-line"></div></div>
  ${closed.map(v=>`<div class="closed-card"><div><div class="closed-name">${v.name}</div><div class="closed-area">${v.area}</div></div><div style="font-size:11px;color:var(--muted);text-align:right">Oop ${v.opensAt}</div></div>`).join("")}
  </div>${navHTML()}</div>`}
function detailHTML(v){
  const score=avg(v.scores);
  const days=[["mon","Ma"],["tue","Di"],["wed","Wo"],["thu","Do"],["fri","Vr"],["sat","Sa"],["sun","So"]];
  return`<div class="detail">
  <div class="det-topbar"><button class="back-btn" onclick="closeDetail()">terug na oop nou</button><span style="font-size:12px;color:var(--muted)">Deel</span></div>
  <div class="photo-zone"><span style="font-size:28px">📷</span><div class="photo-lbl">Fotos kom binnekort</div></div>
  <div class="det-identity">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><div class="det-name">${v.name}</div><div style="text-align:right;flex-shrink:0"><div class="det-score-big">${score}</div><div style="font-size:12px;color:var(--muted)">LekkeSkor</div></div></div>
    <div class="det-meta">${v.isOpen?`<div class="open-pill"><div class="open-dot"></div><span class="open-txt">Oop nou</span></div>`:`<div style="background:var(--red-light);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--red)">Gesluit</div>`}<span class="type-pill">${v.type==="mobile"?"Mobiele kar":"Koffiewinkel"}</span><span style="font-size:12px;color:var(--muted)">${v.area}</span></div>
  </div>
  ${v.special?`<div class="det-special"><div class="sp-eyebrow">Vandag se spesiale</div><div class="sp-title">${v.special}</div><div class="sp-desc">${v.specialDesc}</div><div class="sp-until">Tot ${v.until}</div></div>`:""}
  <div class="det-section"><div class="det-section-head">LekkeSkorte</div>
    <div class="scores-grid">
      <div class="sc"><div class="sc-lbl">Koffiesmaak</div><div class="sc-val">${v.scores.coffee}</div><div class="sc-bar"><div class="sc-fill" style="width:${v.scores.coffee*10}%"></div></div></div>
      <div class="sc"><div class="sc-lbl">Uitsig</div><div class="sc-val">${v.scores.view}</div><div class="sc-bar"><div class="sc-fill" style="width:${v.scores.view*10}%"></div></div></div>
      <div class="sc"><div class="sc-lbl">Prys en Waarde</div><div class="sc-val">${v.scores.price}</div><div class="sc-bar"><div class="sc-fill${v.scores.price<8?" amber":""}" style="width:${v.scores.price*10}%"></div></div></div>
      <div class="sc"><div class="sc-lbl">Vibe</div><div class="sc-val">${v.scores.vibe}</div><div class="sc-bar"><div class="sc-fill" style="width:${v.scores.vibe*10}%"></div></div></div>
    </div>
    <div class="rel-row"><div class="rel-lbl">Betroubaarheid - sal hulle regtig daar wees?</div><div class="rel-track"><div class="rel-fill" style="width:${v.scores.reliability*10}%"></div></div><div class="rel-meta"><span class="rel-score">${v.scores.reliability} / 10</span><span class="rel-desc">${v.scores.reliability>=9?"Baie betroubaar":v.scores.reliability>=7?"Redelik betroubaar":"Wissel soms"}</span></div></div>
  </div>
  <div class="det-section">
    <div class="info-row"><span class="info-lbl">Tipiese prys</span><span class="info-val">${v.price}</span></div>
    <div class="info-row"><span class="info-lbl">Beste tyd</span><span class="info-val">${v.bestTime}</span></div>
    <div class="info-row"><span class="info-lbl">Adres</span><span class="info-val" style="color:var(--green);max-width:200px;text-align:right">${v.address}</span></div>
  </div>
  <div class="hours-section"><div class="hrs-head">Handelsure</div>
    ${days.map(([k,lbl])=>`<div class="hrs-row${k==="sat"?" today":""}"><span class="hrs-day${k==="sat"?" today":""}">${lbl}</span><span style="display:flex;align-items:center;gap:8px"><span class="hrs-time">${v.hours[k]}</span>${k==="sat"?`<span class="today-badge">vandag</span>`:""}</span></div>`).join("")}
  </div>
  <div class="cta-area">
    <button class="cta-primary">Kry aanwysings</button>
    <button class="cta-secondary" onclick="setTab('dash')">Bestuur hierdie inskrywing</button>
  </div>
  ${navHTML()}</div>`}
function mapHTML(){
  return`<div class="app"><div class="main">
  <div class="topbar"><div class="wordmark">Lekke<em>Bru</em></div><span style="font-size:13px;color:var(--muted)">Kaart</span></div>
  <div style="margin:16px 20px;background:var(--card);border-radius:14px;border:0.5px solid var(--border);overflow:hidden"><div style="height:180px;background:linear-gradient(135deg,#c8eadc,#88ccb0);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px"><div style="background:#fff;border-radius:8px;padding:6px 16px;font-family:Syne,sans-serif;font-size:12px;font-weight:700;color:var(--green)">KAART KOM BINNEKORT</div><div style="font-size:12px;color:rgba(0,0,0,0.4)">Supabase + PostGIS integratie</div></div></div>
  <div style="padding:0 20px">${VENDORS.map(v=>`<div onclick="openDetail(${v.id})" style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--border);cursor:pointer"><div><div style="font-size:14px;font-weight:500">${v.name}</div><div style="font-size:12px;color:var(--muted)">${v.area}</div></div><div style="display:flex;align-items:center;gap:8px"><span style="font-family:Syne,sans-serif;font-weight:700;font-size:15px;color:var(--green)">${avg(v.scores)}</span><span style="font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500;${v.isOpen?"background:var(--green-light);color:var(--green-dark)":"background:var(--bg);color:var(--muted)"}">${v.isOpen?"Oop":"Gesluit"}</span></div></div>`).join("")}</div>
  </div>${navHTML()}</div>`}
function dashHTML(){
  const v=VENDORS[5];
  return`<div class="app"><div class="main">
  <div class="topbar"><div class="wordmark">Lekke<em>Bru</em></div><span style="font-size:13px;color:var(--muted)">Dashboard</span></div>
  <div style="background:var(--card);padding:16px 20px;border-bottom:0.5px solid var(--border)"><div style="font-family:Syne,sans-serif;font-size:18px;font-weight:800">${v.name}</div><div style="font-size:12px;color:var(--muted);margin-top:3px">${v.area}</div></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 20px 4px">
    <div style="background:var(--bg);border-radius:10px;padding:14px"><div style="font-size:11px;color:var(--muted);margin-bottom:5px">Kyke vandag</div><div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800;color:var(--green)">47</div></div>
    <div style="background:var(--bg);border-radius:10px;padding:14px"><div style="font-size:11px;color:var(--muted);margin-bottom:5px">LekkeSkor</div><div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800">9.0</div></div>
  </div>
  <div style="background:var(--card);border-radius:12px;border:0.5px solid var(--border);margin:12px 20px 0;padding:16px">
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:12px">Status</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <button id="open-btn" onclick="dashToggle(true)" style="border-radius:10px;padding:16px;border:0.5px solid #97C459;background:var(--green-light);cursor:pointer;font-family:DM Sans,sans-serif;color:var(--green-dark);font-weight:500">Oop<br><span style="font-size:11px;opacity:0.7">Besig nou</span></button>
      <button id="closed-btn" onclick="dashToggle(false)" style="border-radius:10px;padding:16px;border:0.5px solid var(--border);background:var(--card);cursor:pointer;font-family:DM Sans,sans-serif;color:var(--muted)">Gesluit<br><span style="font-size:11px;opacity:0.7">Nie beskikbaar</span></button>
    </div>
  </div>
  <div style="background:var(--card);border-radius:12px;border:0.5px solid var(--border);margin:12px 20px 0;padding:16px">
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:12px">Vandag se spesiale</div>
    <input style="width:100%;border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;font-family:DM Sans,sans-serif;font-size:13px;background:var(--bg);margin-bottom:8px" value="Visserman se Mocha" placeholder="Spesiale naam"/>
    <textarea style="width:100%;border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;font-family:DM Sans,sans-serif;font-size:13px;background:var(--bg);resize:none" rows="2" placeholder="Beskrywing...">Donkersjokolade mocha met n knippie seesout.</textarea>
  </div>
  <div style="padding:16px 20px 0">
    <button onclick="dashSave()" style="width:100%;background:var(--text);color:#fff;border:none;border-radius:12px;padding:15px;font-family:Syne,sans-serif;font-size:14px;font-weight:700;cursor:pointer">Stoor veranderinge</button>
    <div id="toast" style="display:none;background:var(--green-light);border:0.5px solid #97C459;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--green-dark);text-align:center;margin-top:8px">Veranderinge gestoor - jou inskrywing is lewendig</div>
  </div>
  </div>${navHTML()}</div>`}
function navHTML(){
  const t=state.tab;
  return`<nav class="nav-bar">${[["home","Ontdek"],["map","Kaart"],["dash","Dashboard"]].map(([id,lbl])=>`<button class="nav-item${t===id?" active":""}" onclick="setTab('${id}')"><span class="nav-icon">${id==="home"?"☕":id==="map"?"🗺":"⚙️"}</span><span class="nav-lbl">${lbl}</span></button>`).join("")}</nav>`}
function openDetail(id){state.selected=VENDORS.find(v=>v.id===id);render()}
function closeDetail(){state.selected=null;render()}
function setTab(t){state.tab=t;state.selected=null;render()}
function setFilter(f){state.filter=f;render()}
function dashToggle(open){
  document.getElementById("open-btn").style.background=open?"var(--green-light)":"var(--card)";
  document.getElementById("open-btn").style.borderColor=open?"#97C459":"var(--border)";
  document.getElementById("open-btn").style.color=open?"var(--green-dark)":"var(--muted)";
  document.getElementById("closed-btn").style.background=open?"var(--card)":"var(--red-light)";
  document.getElementById("closed-btn").style.borderColor=open?"var(--border)":"#F09595";
  document.getElementById("closed-btn").style.color=open?"var(--muted)":"var(--red)";
}
function dashSave(){
  const t=document.getElementById("toast");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}
render();
</script>
</body>
</html>
